# flake-autoupdate — OSTree-style buffer branch for automatic updates.
#
# BUFFER_BRANCH is a pointer at the last soaked-green SOURCE_BRANCH commit
# (pure mirror, never any robot commit). Pushes to flake / prepare/**
# are all validated (checks run on the pushed branch);
# only SOURCE advances the pointer, after SOAK_RUNS consecutive green runs.
# Machines with system.autoUpdate follow the buffer and bump inputs locally.
# Never move the buffer by hand.
#
# Migration path: feat/auto-update -> prepare/nixos-26.11 -> flake
# (one SOURCE_BRANCH edit per phase + advance_now run, see doc/auto-update.md).

name: flake-autoupdate

on:
  push:
    branches: ["flake", "prepare/**", "feat/**"]
    paths-ignore: ["doc/**", "**.md"]
  schedule:
    - cron: "0 3 */2 * *"
  workflow_dispatch:
    inputs:
      advance_now:
        description: "Move the buffer pointer immediately after green checks (phase change)"
        type: boolean
        default: false
      dry_run:
        description: "Run everything except pointer moves"
        type: boolean
        default: false

concurrency:
  group: flake-autoupdate
  cancel-in-progress: false

env:
  SOURCE_BRANCH: prepare/nixos-26.11
  BUFFER_BRANCH: flake-autoupdate
  SOAK_RUNS: "3"
  MACHINES: "vm-cli-efi vm-desktop-efi vm-cli-efi-zfs"
  DRY_RUN: "false"

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      target: ${{ steps.target.outputs.target }}
      sha: ${{ steps.validated.outputs.sha }}
    steps:
      # Validated branch: SOURCE on schedule/dispatch (no pushed branch),
      # the pushed branch otherwise (validation feedback for any branch).
      - name: Resolve target
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "target=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ env.SOURCE_BRANCH }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.target.outputs.target }}

      # Exact tree under validation — advance only ever moves the pointer
      # to this SHA (never to a newer tip pushed mid-run).
      - name: Record validated revision
        id: validated
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@v23
      # GHA-backed cache, zero-config. FlakeHub upload explicitly off: it
      # needs an account + id-token and only adds noise without one.
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - name: Shell test suites
        run: |
          set -euo pipefail
          for t in test/test-*.sh; do
            echo "--- $t"
            bash "$t"
          done

      - name: Instantiate key configurations
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          for m in $MACHINES; do
            echo "--- $m"
            # Filter the known-benign builtins.derivation/options.json warning
            # (nix evaluation quirk): exit code and real errors are preserved,
            # only the warning lines are dropped.
            nix eval ".#nixosConfigurations.$m.config.system.build.toplevel.drvPath" --raw \
              2> >(grep -v -e "without a proper context" -e "will not have a correct store reference" 1>&2)
          done

  advance:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # env.* is not allowed in job-level `if`, so the source gate lives
      # here: other branches get validation only, no pointer move.
      - name: Gate on source branch
        id: gate
        run: |
          if [[ "${{ needs.check.outputs.target }}" == "$SOURCE_BRANCH" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "target ${{ needs.check.outputs.target }} is not the source ($SOURCE_BRANCH): validation only, no pointer move"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve mode
        id: mode
        run: |
          DRY="${{ env.DRY_RUN }}"
          FORCE="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              DRY="true"
            fi
            if [[ "${{ inputs.advance_now }}" == "true" ]]; then
              FORCE="true"
            fi
          fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "DRY_RUN=$DRY" >> "$GITHUB_ENV"
          echo "mode: dry=$DRY force=$FORCE"

      - name: Advance buffer pointer after soak
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.check.outputs.target }}
          VALIDATED: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin
          SRC_SHA=$(git rev-parse "origin/$TARGET")
          if [[ "$VALIDATED" != "$SRC_SHA" ]]; then
            echo "source moved during validation ($VALIDATED -> $SRC_SHA), deferring to next run"
            exit 0
          fi
          if git ls-remote --heads origin "$BUFFER_BRANCH" | grep -q .; then
            BUF_SHA=$(git rev-parse "origin/$BUFFER_BRANCH")
            if [[ "$BUF_SHA" == "$SRC_SHA" ]]; then
              echo "pointer already current ($BUF_SHA), nothing to do"
              exit 0
            fi
          else
            echo "no remote buffer yet, will create it"
            BUF_SHA=""
          fi
          # Leading green runs on the validated branch, excluding this one;
          # the current green check is the Nth, so SOAK_RUNS-1 are required.
          # Explicit createdAt sort: API order is not contractual.
          GREEN=$(gh run list --workflow flake-autoupdate.yml --branch "$TARGET" --limit 20 \
            --json databaseId,conclusion,createdAt \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | sort_by(.createdAt) | reverse | map(.conclusion) | . as \$cs | (if \$cs | length == 0 then 0 else ([range(0; \$cs | length) | select(\$cs[:.+1] | all(. == \"success\"))] | length) end)")
          NEED=$(( SOAK_RUNS - 1 ))
          echo "consecutive green runs (excluding this one): $GREEN / need $NEED"
          if [[ "${{ steps.mode.outputs.force }}" != "true" ]] && (( GREEN < NEED )); then
            echo "soak not reached, pointer stays at ${BUF_SHA:-<none>}"
            exit 0
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "dry-run: would move $BUFFER_BRANCH ${BUF_SHA:-<none>} -> $SRC_SHA"
          elif [[ -z "$BUF_SHA" ]]; then
            git push origin "$SRC_SHA:refs/heads/$BUFFER_BRANCH"
          else
            git push --force-with-lease="refs/heads/$BUFFER_BRANCH:$BUF_SHA" \
              origin "$SRC_SHA:refs/heads/$BUFFER_BRANCH"
          fi
